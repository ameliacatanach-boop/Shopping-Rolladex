<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Shopping Rolladex</title>

<style>
:root{
  --ink:#111111; --paper:#FFFFFF; --muted:#5E5E5E; --hairline:#D4D4D4; --pill:#EDEDED;
  --lilac:#E3DAF1; --lilac-deep:#6A55A0; --lilac-ink:#4F3E80; --press:#F4F4F4;
  --serif:'Bodoni Moda', Didot, 'Times New Roman', serif;
  --sans:'Instrument Sans', -apple-system, 'Helvetica Neue', sans-serif;
  --safe-b:env(safe-area-inset-bottom, 0px); --safe-t:env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--lilac-deep);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding:calc(20px + var(--safe-t)) 20px calc(110px + var(--safe-b))}
.label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.muted{color:var(--muted)}
.hl{background:linear-gradient(transparent 32%, var(--lilac) 32%, var(--lilac) 86%, transparent 86%);padding:0 4px;margin-left:-4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.star{color:var(--lilac-deep)}
.topline{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ink);min-height:44px}
.textbtn{background:none;border:none;padding:0 2px;min-height:44px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.masthead{font-family:var(--serif);font-size:58px;font-weight:800;line-height:.95;letter-spacing:-.01em;padding:14px 0 12px;border-bottom:3px solid var(--ink);margin:0}
.search{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--ink)}
.search input{border:none;outline:none;background:transparent;font-size:16px;flex:1;min-width:0;height:48px}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ink);flex-wrap:wrap}
.chip{height:36px;padding:0 12px;border:1px solid var(--ink);border-radius:0;background:var(--ink);color:var(--paper);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;position:relative}
.chip::after{content:"";position:absolute;inset:-4px 0}
.chip.outline{background:var(--paper);color:var(--ink)}
.chip.trip{background:var(--lilac);color:var(--ink);border-color:var(--lilac-deep)}
.metaline{display:flex;justify-content:space-between;align-items:center;min-height:44px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--hairline)}
.sortsel{border:none;background:transparent;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;min-height:44px;text-align:right;-webkit-appearance:none;appearance:none;padding-right:16px;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 7px) 55%,calc(100% - 2px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.notice{font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.4;padding:12px 0;border-bottom:1px solid var(--hairline)}
.notice b{font-style:normal;font-family:var(--sans);font-size:13px}
.row{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--hairline);text-decoration:none;color:var(--ink);min-height:64px;width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left}
.row:active{background:var(--press)}
.row .num{font-size:12px;font-weight:600;width:28px;flex:none;padding-top:7px;font-variant-numeric:tabular-nums}
.row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.row .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row .name{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.2;text-transform:uppercase;overflow-wrap:anywhere}
.row .tier{font-size:12px;font-weight:600;letter-spacing:.06em;white-space:nowrap;flex:none}
.row.dim .name{color:var(--muted)}
.row.gone .name{text-decoration:line-through}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;background:var(--pill);padding:3px 8px;border-radius:999px;color:var(--ink)}
.pill.lg{font-size:12px;padding:6px 12px}
.empty{padding:40px 0;text-align:center}
.empty p{font-family:var(--serif);font-style:italic;font-size:20px;margin:0 0 16px}
.skel{height:18px;background:var(--pill);margin:22px 0 22px 42px;width:60%}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:0 20px calc(20px + var(--safe-b));pointer-events:none;z-index:5}
.bottom > *{pointer-events:auto;max-width:560px;margin:0 auto}
.bottom:not(:empty){background:var(--paper);padding-top:12px;border-top:1px solid var(--ink)}
.bar{background:var(--ink);color:var(--paper);font-size:12px;padding:8px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar button{background:none;border:1px solid var(--paper);color:var(--paper);font-size:11px;font-weight:600;letter-spacing:.1em;min-height:32px;padding:0 10px}
.primary{display:flex;align-items:center;justify-content:center;width:100%;height:56px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:0;text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.secondary{display:flex;align-items:center;justify-content:center;height:56px;background:var(--paper);color:var(--ink);border:1px solid var(--ink);border-radius:0;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;padding:0 16px}
.secondary[aria-disabled="true"],.primary[aria-disabled="true"]{color:var(--muted);border-color:var(--hairline);background:var(--paper)}
.layer{position:fixed;inset:0;background:var(--paper);overflow-y:auto;z-index:10;-webkit-overflow-scrolling:touch}
.layer[hidden]{display:none}
.pagetitle{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:3px solid var(--ink)}
.pagetitle h1{font-family:var(--serif);font-size:40px;font-weight:800;margin:0;line-height:1}
.sect{padding:16px 0;border-bottom:1px solid var(--ink)}
.sect:last-child{border-bottom:none}
.sect .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.val{font-family:var(--serif);font-size:20px;font-weight:600}
.tiers{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--ink)}
.tiers button{height:44px;border:none;border-right:1px solid var(--ink);background:var(--paper);font-family:var(--serif);font-size:18px;padding:0}
.tiers button:last-child{border-right:none}
.tiers button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-right-color:var(--paper)}
.tiers button[aria-pressed="true"]:last-child,.tiers button[aria-pressed="true"]+button[aria-pressed="false"]{}
.caption{font-size:12px;color:var(--muted);margin-top:10px}
.offerbtn{height:36px;padding:0 12px;border:none;border-radius:999px;background:var(--pill);font-size:13px;position:relative}
.offerbtn::after{content:"";position:absolute;inset:-4px 0}
.offerbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.offerbtn .n{opacity:.6;margin-left:4px;font-size:11px}
.check{display:flex;justify-content:space-between;align-items:center;min-height:44px;font-size:15px;gap:12px}
.check input{width:20px;height:20px;accent-color:var(--lilac-deep);flex:none}
.check .n{color:var(--muted);font-size:12px;margin-left:6px}
.navrow{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:64px;background:none;border:none;padding:16px 0;border-bottom:1px solid var(--ink);text-align:left}
.navrow .val{font-weight:400}
.detailname{font-family:var(--serif);font-size:56px;font-weight:800;line-height:.98;margin:0;text-transform:uppercase;overflow-wrap:anywhere}
.standfirst{font-family:var(--serif);font-style:italic;font-size:17px;color:#333}
.logo{width:56px;height:56px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--pill);font-family:var(--serif);font-weight:800;font-size:20px;overflow:hidden;color:var(--ink)}
.logo img{width:34px;height:34px;object-fit:contain;filter:grayscale(1) contrast(1.15);mix-blend-mode:multiply}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:3px solid var(--ink);border-bottom:1px solid var(--ink)}
.stats > div{padding:12px 10px;display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--ink);min-width:0}
.stats > div:first-child{border-left:none;background:var(--lilac)}
.stats .big{font-family:var(--serif);font-size:30px;font-weight:800;line-height:1;overflow-wrap:anywhere}
.stats .small{font-size:11px;color:var(--muted)}
.stats > div:first-child .small{color:var(--ink)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 0;border-bottom:1px solid var(--ink)}
.kv .v{font-family:var(--serif);font-size:18px;text-align:right;overflow-wrap:anywhere}
.badge{display:inline-flex;align-items:center;height:32px;padding:0 10px;border:1px solid var(--lilac-deep);color:var(--lilac-deep);font-size:11px;font-weight:600;letter-spacing:.12em}
.signin{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:24px}
.signin p{font-family:var(--serif);font-style:italic;font-size:20px;margin:0}
.err{background:var(--lilac);padding:12px 14px;font-size:14px;line-height:1.4}
.field{display:flex;flex-direction:column;gap:6px;padding-top:16px}
.field input,.field select,.field textarea{border:none;border-bottom:1px solid var(--ink);border-radius:0;background:transparent;font-family:var(--serif);font-size:19px;min-height:44px;padding:4px 0;width:100%;-webkit-appearance:none;appearance:none}
.field select{font-family:var(--sans);font-size:16px;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 9px) 55%,calc(100% - 4px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:20px}
.field textarea{font-style:italic;font-size:17px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);font-size:16px}
.field .tiers{margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:end}
.dupe{margin-top:14px;padding:14px 16px;background:var(--lilac);display:flex;justify-content:space-between;align-items:center;gap:12px}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-top:16px}
.secondary.fav{height:48px;font-size:12px;border-color:var(--lilac-deep);color:var(--lilac-deep)}
.secondary.fav.on{background:var(--lilac);color:var(--ink)}
.selectbtn{position:relative;display:block}
.selectbtn select{width:100%;height:48px;border:1px solid var(--ink);border-radius:0;background:var(--paper);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;text-align:center;text-align-last:center;-webkit-appearance:none;appearance:none;padding:0 24px}
.selectbtn::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.layer{animation:up .2s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

<script>
/* CORE START — pure logic, no DOM. Tested against the real Sheet. */
var Core = (function(){
  var OFFERS = ['Clothing','Tops','Knitwear','Dresses','Pants & skirts','Denim','Outerwear','Swim','Lingerie','Sleep & lounge','Activewear','Shoes','Bags','Accessories','Jewellery','Fine jewellery','Homewares'];
  var TYPES = ['Own label','Multi-brand boutique','Vintage & resale'];
  var STATUSES = ['Want to try','Bought from','Not for me'];
  var REGION = {
    'Australia':'Australia','New Zealand':'New Zealand','UK':'UK',
    'France':'Europe','Spain':'Europe','Denmark':'Europe','Italy':'Europe','Sweden':'Europe','Netherlands':'Europe','Germany':'Europe','Portugal':'Europe','Belgium':'Europe','Poland':'Europe','Ukraine':'Europe',
    'USA':'North America','Canada':'North America','Mexico':'North America',
    'Argentina':'Latin America','Colombia':'Latin America',
    'India':'Asia','Japan':'Asia','South Korea':'Asia','Vietnam':'Asia','Malaysia':'Asia',
    'Turkey':'Middle East & Africa','Egypt':'Middle East & Africa','Lebanon':'Middle East & Africa','South Africa':'Middle East & Africa'
  };
  var REGIONS = ['Australia','New Zealand','UK','Europe','North America','Latin America','Asia','Middle East & Africa','Rest of world'];
  function regionOf(country){ return REGION[country] || (country ? 'Rest of world' : ''); }

  function fold(s){ return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
  function norm(s){ return fold(s).replace(/[^a-z0-9]/g,''); }
  function list(s){ return String(s == null ? '' : s).split(',').map(function(x){return x.trim();}).filter(Boolean); }

  function parseShops(values){
    if (!values || !values.length) return [];
    var head = values[0].map(function(h){ return norm(h); });
    function col(name){ return head.indexOf(norm(name)); }
    var C = {id:col('ID'),fav:col('Favourite'),name:col('Name'),link:col('Link'),type:col('Shop type'),based:col('Based in'),tier:col('Price tier'),priceNote:col('Price note'),offers:col('Offers'),ships:col('Ships to AU'),shipNote:col('Shipping note'),currency:col('Currency'),cities:col('Store cities'),storeDetails:col('Store details'),status:col('Status'),avail:col('Availability'),notes:col('Notes'),added:col('Date added'),visited:col('Last visited')};
    if (C.name < 0) throw new Error('The Shops tab has no "Name" column.');
    var out = [];
    for (var i = 1; i < values.length; i++){
      var r = values[i] || [];
      var g = function(k){ var j = C[k]; return j < 0 ? '' : String(r[j] == null ? '' : r[j]).trim(); };
      var name = g('name'); if (!name) continue;
      var tierTxt = g('tier'); var tm = tierTxt.match(/^(\d)/);
      out.push({
        row: i + 1, id: g('id') || ('row' + (i + 1)), fav: g('fav') !== '', name: name, link: g('link'),
        type: g('type'), based: g('based'), region: regionOf(g('based')),
        tier: tm ? Number(tm[1]) : null, tierLabel: tierTxt.replace(/^\d\s*-\s*/,''),
        priceNote: g('priceNote'), offers: list(g('offers')), ships: g('ships'), shipNote: g('shipNote'), currency: g('currency'),
        cities: list(g('cities')), storeDetails: g('storeDetails'), status: g('status'), avail: g('avail') || 'Available',
        notes: g('notes'), added: g('added'), visited: g('visited'), key: norm(name)
      });
    }
    return out;
  }
  function parseGuide(values){
    var g = {};
    (values || []).slice(1).forEach(function(r){ var t = parseInt(r[0], 10); if (t) g[t] = {label: r[1] || '', price: r[2] || '', desc: r[3] || ''}; });
    return g;
  }

  // Approximate substring match: smallest edit distance between p and any substring of t.
  function approx(p, t){
    var prev = new Array(t.length + 1).fill(0), cur = new Array(t.length + 1);
    for (var i = 1; i <= p.length; i++){
      cur[0] = i;
      for (var j = 1; j <= t.length; j++){
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (p[i - 1] === t[j - 1] ? 0 : 1));
      }
      var tmp = prev; prev = cur; cur = tmp;
    }
    return Math.min.apply(null, prev);
  }
  function domainOf(link){ try { return new URL(/^https?:/i.test(link) ? link : 'https://' + link).hostname.replace(/^www\./,''); } catch(e){ return ''; } }
  function nameMatches(shop, text){
    var q = norm(text); if (!q) return true;
    if (shop.key.indexOf(q) >= 0) return true;
    var d = norm(domainOf(shop.link)); if (q.length >= 3 && d.indexOf(q) >= 0) return true;
    if (q.length < 4) return false;
    var allowed = q.length >= 8 ? 2 : 1;
    return approx(q, shop.key) <= allowed;
  }

  // ---- Smart search ----
  var OFFER_WORDS = [
    ['fine jewellery','Fine jewellery'],['fine jewelry','Fine jewellery'],
    ['jewellery','Jewellery'],['jewelry','Jewellery'],['jewels','Jewellery'],['earrings','Jewellery'],['necklaces','Jewellery'],
    ['knitwear','Knitwear'],['knits','Knitwear'],['knit','Knitwear'],['jumpers','Knitwear'],['jumper','Knitwear'],['sweaters','Knitwear'],['sweater','Knitwear'],['cardigans','Knitwear'],['cardigan','Knitwear'],
    ['dresses','Dresses'],['dress','Dresses'],
    ['tops','Tops'],['top','Tops'],['shirts','Tops'],['shirt','Tops'],['tees','Tops'],['blouses','Tops'],
    ['pants','Pants & skirts'],['trousers','Pants & skirts'],['skirts','Pants & skirts'],['skirt','Pants & skirts'],['shorts','Pants & skirts'],
    ['denim','Denim'],['jeans','Denim'],
    ['outerwear','Outerwear'],['coats','Outerwear'],['coat','Outerwear'],['jackets','Outerwear'],['jacket','Outerwear'],['blazers','Outerwear'],
    ['swimwear','Swim'],['swimsuits','Swim'],['bikinis','Swim'],['swim','Swim'],
    ['lingerie','Lingerie'],['underwear','Lingerie'],['intimates','Lingerie'],['bras','Lingerie'],
    ['sleepwear','Sleep & lounge'],['loungewear','Sleep & lounge'],['pyjamas','Sleep & lounge'],['pajamas','Sleep & lounge'],
    ['activewear','Activewear'],['sportswear','Activewear'],
    ['footwear','Shoes'],['shoes','Shoes'],['boots','Shoes'],['sandals','Shoes'],['sneakers','Shoes'],['heels','Shoes'],
    ['handbags','Bags'],['bags','Bags'],['bag','Bags'],['totes','Bags'],
    ['accessories','Accessories'],['scarves','Accessories'],['hats','Accessories'],['belts','Accessories'],['sunglasses','Accessories'],
    ['homewares','Homewares'],['homeware','Homewares'],
    ['clothing','Clothing'],['clothes','Clothing']
  ];
  var PLACE_WORDS = [
    ['north american','region:North America'],['latin american','region:Latin America'],['middle eastern','region:Middle East & Africa'],
    ['european','region:Europe'],['europe','region:Europe'],['asian','region:Asia'],['asia','region:Asia'],
    ['new zealand','country:New Zealand'],['kiwi','country:New Zealand'],['nz','country:New Zealand'],
    ['south african','country:South Africa'],['south africa','country:South Africa'],['south korean','country:South Korea'],['south korea','country:South Korea'],['korean','country:South Korea'],['korea','country:South Korea'],
    ['australian','country:Australia'],['australia','country:Australia'],['aussie','country:Australia'],
    ['british','country:UK'],['english','country:UK'],['england','country:UK'],['london','country:UK'],['uk','country:UK'],
    ['american','country:USA'],['usa','country:USA'],['new york','country:USA'],
    ['french','country:France'],['france','country:France'],['paris','country:France'],['parisian','country:France'],
    ['spanish','country:Spain'],['spain','country:Spain'],['barcelona','country:Spain'],
    ['danish','country:Denmark'],['denmark','country:Denmark'],['copenhagen','country:Denmark'],['scandi','region:Europe'],
    ['italian','country:Italy'],['italy','country:Italy'],['swedish','country:Sweden'],['sweden','country:Sweden'],
    ['dutch','country:Netherlands'],['netherlands','country:Netherlands'],['german','country:Germany'],['germany','country:Germany'],
    ['portuguese','country:Portugal'],['portugal','country:Portugal'],['belgian','country:Belgium'],['polish','country:Poland'],['ukrainian','country:Ukraine'],
    ['canadian','country:Canada'],['canada','country:Canada'],['mexican','country:Mexico'],['argentinian','country:Argentina'],['argentina','country:Argentina'],['colombian','country:Colombia'],
    ['indian','country:India'],['india','country:India'],['japanese','country:Japan'],['japan','country:Japan'],['vietnamese','country:Vietnam'],['malaysian','country:Malaysia'],
    ['turkish','country:Turkey'],['turkey','country:Turkey'],['egyptian','country:Egypt'],['lebanese','country:Lebanon']
  ];
  var TIER_LABELS = [['ultra luxury',7],['ultra-luxury',7],['budget',1],['accessible',2],['contemporary',3],['premium',4],['luxury',5]];
  var STOP = {and:1,or:1,with:1,the:1,a:1,an:1,shops:1,shop:1,stores:1,store:1,that:1,sell:1,sells:1,selling:1,for:1,from:1,based:1,made:1,in:1,of:1,me:1,show:1,find:1,brands:1,brand:1,labels:1,label:1,only:1,my:1};
  function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

  function parseQuery(q, shops){
    var raw = String(q || '').trim();
    var res = {chips: [], text: ''};
    if (!raw) return res;
    var n = norm(raw);
    var s =' ' + fold(raw).replace(/[–—]/g,'-').replace(/[,;/+]/g,' ').replace(/★/g,' favourites ').replace(/\s+/g,' ') + ' ';
    function take(re, fn){ s = s.replace(re, function(){ var c = fn.apply(null, arguments); if (c) { c.src = arguments[0].trim(); res.chips.push(c); } return ' '; }); }
    // Trip mode: "in Sydney"
    var cities = [];
    (shops || []).forEach(function(sh){ sh.cities.forEach(function(c){ if (cities.indexOf(c) < 0) cities.push(c); }); });
    cities.sort(function(a,b){ return b.length - a.length; }).forEach(function(c){

  // ---------- Changes: apply instantly, then send to the Sheet in order ----------
  function enqueue(op, interactive){
    op.ts = Date.now();
    state.data = Object.assign({}, state.data, {shops: Core.applyLocal(state.data.shops, op)});
    applyData(state.data);
    state.queue.push(op); lsSet(K.queue, state.queue);

    flush(interactive);
  }
  function flush(interactive){
    if (state.flushing || !state.queue.length) return;
    if (!navigator.onLine){ state.offline = true; renderBottom(); return; }
    if (!canWrite()){
      if (interactive) auth(true, function(){ flush(false); });
      else renderBottom();
      return;
    }
    state.flushing = true; state.error = ''; renderBottom();
    (function next(){
      var op = state.queue[0];
      if (!op){ state.flushing = false; toast('Saved to your Sheet'); return sync(false); }
      writer.apply(SHEET_ID, op).then(function(res){
        if (res.status === 'conflict'){ state.flushing = false; state.conflict = {op: op, conflicts: res.conflicts}; location.hash = 'conflict'; render(); return; }
        if (res.status === 'missing') toast('That shop is no longer in the Sheet, so the change was skipped.');
        if (op.op === 'add' && res.id && res.id !== op.id) renameLocal(op.id, res.id);
        state.queue.shift(); lsSet(K.queue, state.queue);
        next();
      }).catch(function(e){
        state.flushing = false; failed(e);

        render();
      });
    })();
  }
  function renameLocal(from, to){

          field('f-ships', 'Ships to AU', '<select id="f-ships">' + opt(Core.SHIPS, d.ships, '—') + '</select>') +
        '</div>' +
        field('f-currency', 'Currency', '<select id="f-currency">' + opt(Core.CURRENCIES, d.currency, '—') + '</select>') +
        field('f-price', 'Price note', '<input id="f-price" autocomplete="off" placeholder="e.g. Knit ~$290" value="' + h(d.priceNote) + '">') +
        field('f-ship', 'Shipping note', '<input id="f-ship" autocomplete="off" placeholder="Duties, free-shipping threshold" value="' + h(d.shipNote) + '">')
      : '') +
      field('f-notes', 'Notes', '<textarea id="f-notes" rows="3">' + h(d.notes) + '</textarea>') +
      '<div id="formerr" aria-live="assertive"></div>' +
      '<div style="padding-top:20px"><button type="submit" class="primary" id="save">' + (edit ? 'Save changes' : 'Add to the index') + '</button></div>' +
      (edit ? '<div id="delwrap" style="padding-top:28px"></div>' : '') +
    '</form></div>';

    function readInputs(){
      d.link = $('f-link').value; d.name = $('f-name').value; d.type = $('f-type').value;
      var b = $('f-based').value; d.based = b === '__other' ? $('f-other').value.trim() : b;
      d.cities = $('f-cities').value; d.storeDetails = $('f-store').value; d.fav = $('f-fav').checked; d.status = $('f-status').value; d.notes = $('f-notes').value;
      if (edit){ d.avail = $('f-avail').value; d.ships = $('f-ships').value; d.currency = $('f-currency').value; d.priceNote = $('f-price').value; d.shipNote = $('f-ship').value; }
    }
    function dupes(){
      readInputs();
      var list = Core.findDuplicates(state.shops, d.name, d.link, s ? s.id : null);
      $('dupes').innerHTML = list.length ? list.slice(0, 3).map(function(x){
        return '<div class="dupe"><div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span class="label" style="color:var(--lilac-ink)">Already in the index · ' + h(x.why) + '</span>' +
          '<span class="val" style="text-transform:uppercase">' + h(x.shop.name) + '</span><span style="font-size:12px">' + h([x.shop.type, x.shop.based, x.shop.tier ? 'Tier ' + x.shop.tier : ''].filter(Boolean).join(' · ')) + '</span></div>' +
          '<a class="primary" style="width:auto;height:44px;padding:0 14px;font-size:12px" href="#shop/' + encodeURIComponent(x.shop.id) + '">Open</a></div>';
      }).join('') : '';
      $('save').textContent = list.length && !edit ? 'Save anyway' : (edit ? 'Save changes' : 'Add to the index');
    }
    function tierCap(){ var g = state.guide[d.tier] || {}; $('tiercap').textContent = d.tier ? (g.label || '') + (g.price ? ' · ' + g.price + ' core item' : '') : 'Tap a tier. Tap it again to clear.'; }
    $('f-link').addEventListener('input', function(){
      if (!L.nameTouched){ $('f-name').value = Core.guessName($('f-link').value); }
      dupes();
    });
    $('f-name').addEventListener('input', function(){ L.nameTouched = true; dupes(); });
    $('f-based').onchange = function(){ $('otherwrap').hidden = this.value !== '__other'; if (this.value === '__other') $('f-other').focus(); };
    each(L, '[data-t]', function(b){ b.onclick = function(){ var t = +b.getAttribute('data-t'); d.tier = d.tier === t ? null : t; each(L, '[data-t]', function(x){ x.setAttribute('aria-pressed', String(+x.getAttribute('data-t') === d.tier)); }); tierCap(); }; });
    each(L, '[data-o]', function(b){ b.onclick = function(){ var o = b.getAttribute('data-o'), i = d.offers.indexOf(o); i >= 0 ? d.offers.splice(i, 1) : d.offers.push(o); b.setAttribute('aria-pressed', String(i < 0)); }; });
    $('cancel').onclick = function(e){ e.preventDefault(); formFor = null; goBack(s ? '#shop/' + s.id : ''); };
    $('shopform').onsubmit = function(e){
      e.preventDefault(); readInputs();
      if (!d.name.trim()){ $('formerr').innerHTML = '<div class="err" style="margin-top:16px">Add a name before saving.</div>'; $('f-name').focus(); return; }
      var fields = {name: d.name.trim(), link: d.link, type: d.type, based: d.based, tier: d.tier, offers: d.offers, cities: d.cities, storeDetails: d.storeDetails, fav: d.fav, status: d.status, notes: d.notes};
      if (edit){
        Object.assign(fields, {avail: d.avail, ships: d.ships, currency: d.currency, priceNote: d.priceNote, shipNote: d.shipNote});
        formFor = null; location.replace('#shop/' + encodeURIComponent(s.id));
        var changed = update(s.id, fields, true);
        if (!changed) toast('No changes to save');
      } else {
        var id = Core.nextId(state.data.shops);
        var cells = Core.toCells(fields); cells['Date added'] = Core.localDate(); cells['Availability'] = 'Available';
        formFor = null; location.replace('#shop/' + encodeURIComponent(id));
        enqueue({op: 'add', id: id, cells: cells}, true);
      }
    };
    if (edit){
      var del = $('delwrap');
      function drawDel(){
        del.innerHTML = L.confirmDelete
          ? '<div class="dupe" style="flex-direction:column;align-items:stretch"><span class="val">Delete ' + h(s.name.toUpperCase()) + '?</span><span style="font-size:13px;line-height:1.4">This removes its row from your Sheet. Marking it Unavailable instead keeps it but hides it.</span>' +
            '<div class="grid2" style="padding:0"><button type="button" class="secondary" id="delno">Keep it</button><button type="button" class="primary" id="delyes">Delete</button></div></div>'
          : '<button type="button" class="textbtn" id="delask" style="text-decoration:underline">Delete this shop</button>';
        if (L.confirmDelete){
          $('delno').onclick = function(){ L.confirmDelete = false; drawDel(); };
          $('delyes').onclick = function(){ formFor = null; location.replace('#'); enqueue({op: 'delete', id: s.id}, true); toast('Deleted ' + s.name); };
        } else $('delask').onclick = function(){ L.confirmDelete = true; drawDel(); };
      }
      drawDel();
    }
    tierCap(); dupes();
    L.scrollTop = 0;
    if (!edit) setTimeout(function(){ $('f-link') && $('f-link').focus(); }, 50);
  }

  // ---------- Conflict ----------
  function renderConflict(L){
    var c = state.conflict;
    if (!c){ location.replace('#'); return; }
    var s = shopById(c.op.id) || {name: c.op.id};
    L.innerHTML = '<div class="wrap"><div class="pagetitle"><h1>CHECK THIS</h1></div>' +
      '<p class="standfirst" style="padding:16px 0 8px">' + h(s.name) + ' was also changed in the Sheet since the app last loaded it. Which version should stay?</p>' +
      c.conflicts.map(function(x){ return '<div class="sect"><span class="label">' + h(x.field) + '</span>' +
        '<div class="kv" style="border-bottom:1px solid var(--hairline)"><span class="label muted">In the Sheet</span><span class="v">' + h(x.sheet || '(empty)') + '</span></div>' +
        '<div class="kv" style="border:none"><span class="label muted">Yours</span><span class="v">' + h(x.mine || '(empty)') + '</span></div></div>'; }).join('') +
      '<div class="grid2" style="padding-top:20px"><button class="secondary" id="keepsheet">Keep the Sheet’s</button><button class="primary" id="keepmine">Keep mine</button></div></div>';
    $('keepmine').onclick = function(){ c.op.force = true; lsSet(K.queue, state.queue); state.conflict = null; location.replace('#shop/' + c.op.id); flush(true); };
    $('keepsheet').onclick = function(){ state.queue.shift(); lsSet(K.queue, state.queue); state.conflict = null; location.replace('#shop/' + c.op.id); state.queue.length ? flush(true) : sync(false); };
  }

  // ---------- Filters ----------
  function counts(field){
    var c = {};
    state.shops.forEach(function(s){ if (Core.isHiddenByDefault(s) && !state.settings.filters.showHidden) return; var v = s[field]; (Array.isArray(v) ? v : [v]).forEach(function(x){ if (x) c[x] = (c[x] || 0) + 1; }); });
    return c;
  }
  function renderFilters(L){
    var f = state.settings.filters, res = Core.run(state.shops, state.settings);
    var lo = f.tierMin, hi = f.tierMax, g = state.guide;
    var tierVal = lo == null ? 'Any' : lo === hi ? String(lo) : lo + ' – ' + hi;
    var cap = lo == null ? 'Tap one tier, or two to set a range.' : ((g[lo] || {}).label || '') + (hi !== lo ? ' to ' + ((g[hi] || {}).label || '') : '') + ' · ' + priceRange(lo, hi) + ' core item';
    var oc = counts('offers'), tc = counts('type'), sc = counts('status');
    var placeVal = f.places.length ? f.places.map(function(p){ return p.split(':')[1]; }).join(', ') : 'Anywhere';
    var hiddenTotal = state.shops.filter(Core.isHiddenByDefault).length;
    L.innerHTML = '<div class="wrap">' +
      '<div class="pagetitle"><h1>INDEX</h1><button class="textbtn" id="clear" style="text-decoration:underline">Clear all</button></div>' +
      '<div class="sect"><div class="head"><span class="label">I. Price tier</span><span class="val"><span class="hl">' + h(tierVal) + '</span></span></div>' +
        '<div class="tiers" role="group" aria-label="Price tier">' + [1,2,3,4,5,6,7].map(function(t){ var on = lo != null && t >= lo && t <= hi; return '<button data-t="' + t + '" aria-pressed="' + on + '" aria-label="Tier ' + t + ' ' + h((g[t] || {}).label || '') + '">' + t + '</button>'; }).join('') + '</div>' +
        '<div class="caption">' + h(cap) + '</div></div>' +
      '<div class="sect"><div class="head"><span class="label">II. Offers</span></div><div style="display:flex;flex-wrap:wrap;gap:8px">' +
        Core.OFFERS.map(function(o){ return '<button class="offerbtn" data-o="' + h(o) + '" aria-pressed="' + (f.offers.indexOf(o) >= 0) + '">' + h(o) + '<span class="n">' + (oc[o] || 0) + '</span></button>'; }).join('') + '</div></div>' +
      '<div class="sect"><div class="head"><span class="label">III. Shop type</span></div>' +
        Core.TYPES.map(function(t){ return '<label class="check"><span>' + h(t) + '<span class="n">' + (tc[t] || 0) + '</span></span><input type="checkbox" data-ty="' + h(t) + '"' + (f.types.indexOf(t) >= 0 ? ' checked' : '') + '></label>'; }).join('') + '</div>' +
      '<a class="navrow" href="#filters/places" style="text-decoration:none;color:var(--ink)"><span style="display:flex;flex-direction:column;gap:4px"><span class="label">IV. Based in</span><span class="val">' + h(placeVal) + '</span></span><span style="font-size:20px">›</span></a>' +
      '<a class="navrow" href="#filters/trip" style="text-decoration:none;color:var(--ink)"><span style="display:flex;flex-direction:column;gap:4px"><span class="label">V. Trip mode</span><span class="val' + (f.trip ? '' : ' muted') + '">' + h(f.trip || 'Off') + '</span></span><span style="font-size:20px">›</span></a>' +
      '<div class="sect"><div class="head"><span class="label">VI. Yours</span></div>' +
        '<label class="check"><span>★ Favourites only</span><input type="checkbox" id="fav"' + (f.favOnly ? ' checked' : '') + '></label>' +
        Core.STATUSES.map(function(t){ return '<label class="check"><span>' + h(t) + '<span class="n">' + (sc[t] || 0) + '</span></span><input type="checkbox" data-st="' + h(t) + '"' + (f.statuses.indexOf(t) >= 0 ? ' checked' : '') + '></label>'; }).join('') +
        '<label class="check"><span>Show unavailable and “Not for me”<span class="n">' + hiddenTotal + '</span></span><input type="checkbox" id="hid"' + (f.showHidden ? ' checked' : '') + '></label>' +
      '</div>' +
      '<div style="padding-top:20px"><a class="primary" href="#" id="done">Show ' + res.list.length + ' shops</a></div>' +
    '</div>';
    function upd(){ save(); renderResults(); var st = L.scrollTop; renderFilters(L); L.scrollTop = st; }
    each(L, '[data-t]', function(b){ b.onclick = function(){
      var t = +b.getAttribute('data-t');
      if (f.tierMin == null) { f.tierMin = f.tierMax = t; }
      else if (f.tierMin === f.tierMax) { if (t === f.tierMin) f.tierMin = f.tierMax = null; else { f.tierMin = Math.min(t, f.tierMin); f.tierMax = Math.max(t, f.tierMax); } }
      else { f.tierMin = f.tierMax = t; }
      upd();
    }; });
    each(L, '[data-o]', function(b){ b.onclick = function(){ var o = b.getAttribute('data-o'); var i = f.offers.indexOf(o); i >= 0 ? f.offers.splice(i, 1) : f.offers.push(o); upd(); }; });
    each(L, '[data-ty]', function(b){ b.onchange = function(){ var o = b.getAttribute('data-ty'); var i = f.types.indexOf(o); i >= 0 ? f.types.splice(i, 1) : f.types.push(o); upd(); }; });
    each(L, '[data-st]', function(b){ b.onchange = function(){ var o = b.getAttribute('data-st'); var i = f.statuses.indexOf(o); i >= 0 ? f.statuses.splice(i, 1) : f.statuses.push(o); upd(); }; });
    $('fav').onchange = function(){ f.favOnly = this.checked; upd(); };
    $('hid').onchange = function(){ f.showHidden = this.checked; upd(); };
    $('clear').onclick = function(){ state.settings.filters = Core.defaultFilters(); save(); renderResults(); renderFilters(L); };
    $('done').onclick = function(e){ e.preventDefault(); location.hash = ''; };
  }
  function priceRange(lo, hi){
    var g = state.guide, a = (g[lo] || {}).price || '', b = (g[hi] || {}).price || '';
    if (lo === hi) return a;
    var from = a.replace(/^Under\s*/i, '$0 - ').split(/\s*-\s*/)[0], to = b.split(/\s*-\s*/).pop();
    return (from || '') + '–' + (to || '');
  }
  function renderPicker(L, kind){
    var f = state.settings.filters, html = '';
    if (kind === 'places'){
      var byC = counts('based'), byR = counts('region');
      html = '<div class="sect"><div class="head"><span class="label">Regions</span></div>' +
        Core.REGIONS.filter(function(r){ return byR[r]; }).map(function(r){ var v = 'region:' + r; return '<label class="check"><span>' + h(r) + '<span class="n">' + byR[r] + '</span></span><input type="checkbox" data-p="' + h(v) + '"' + (f.places.indexOf(v) >= 0 ? ' checked' : '') + '></label>'; }).join('') + '</div>' +
        '<div class="sect"><div class="head"><span class="label">Countries</span></div>' +
        Object.keys(byC).sort().map(function(c){ var v = 'country:' + c; return '<label class="check"><span>' + h(c) + '<span class="n">' + byC[c] + '</span></span><input type="checkbox" data-p="' + h(v) + '"' + (f.places.indexOf(v) >= 0 ? ' checked' : '') + '></label>'; }).join('') + '</div>';
    } else {
      var cc = counts('cities'), cities = Object.keys(cc).sort();
      html = '<div class="sect"><p class="standfirst" style="margin:0 0 8px">Only shops with a store in one city. Your other filters still apply.</p>' +
        '<label class="check"><span>Off</span><input type="radio" name="trip" data-c=""' + (!f.trip ? ' checked' : '') + '></label>' +
        cities.map(function(c){ return '<label class="check"><span>' + h(c) + '<span class="n">' + cc[c] + '</span></span><input type="radio" name="trip" data-c="' + h(c) + '"' + (f.trip === c ? ' checked' : '') + '></label>'; }).join('') +
        (cities.length ? '' : '<p class="muted">No shops have a Store city yet.</p>') + '</div>';
    }
    L.innerHTML = '<div class="wrap"><div class="pagetitle"><h1>' + (kind === 'places' ? 'BASED IN' : 'TRIP MODE') + '</h1><a class="textbtn" href="#filters">Done</a></div>' + html + '</div>';
    each(L, '[data-p]', function(b){ b.onchange = function(){ var v = b.getAttribute('data-p'); var i = f.places.indexOf(v); i >= 0 ? f.places.splice(i, 1) : f.places.push(v); save(); renderResults(); }; });
    each(L, '[data-c]', function(b){ b.onchange = function(){ f.trip = b.getAttribute('data-c') || null; save(); renderResults(); location.hash = 'filters'; }; });
  }

  // ---------- Start ----------
  window.addEventListener('hashchange', renderLayer);
  window.addEventListener('online', function(){ state.offline = false; state.queue.length ? flush(false) : sync(false); });
  window.addEventListener('offline', function(){ state.offline = true; renderBottom(); });
  loadCache();
  render();
  if (token()) sync(false);
  window.__rolladex = {state: state, flush: flush, sync: sync};
})();
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.rolladexAuthReady && window.rolladexAuthReady()"></script>
</body>
</html>
